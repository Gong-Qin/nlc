[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nlc-cmd"
version = "0.2.0"
description = "NLC · 自然语言命令行 —— 在人与命令行之间加一层只翻译、不执行的 AI"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Gong-Qin" }]
keywords = ["cli", "natural-language", "shell", "mcp", "safety", "chinese"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
    "Natural Language :: Chinese (Simplified)",
]

# 注意：装到 PATH 上的命令叫 nlc（发行名带 -cmd 是为了避开 PyPI 重名）
[project.scripts]
nlc = "nlc.cli:main"

[project.urls]
Homepage = "https://github.com/Gong-Qin/nlc"
Source = "https://github.com/Gong-Qin/nlc"

[tool.setuptools]
packages = ["nlc"]
